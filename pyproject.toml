[project]
name = "agentic-paper-library"
version = "0.1.0"
description = "Read and organise a research-paper library with a coding agent: each paper as its PDF and the PDF's text layer, with skills for adding, reading and reviewing them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6",                     # the metadata of web articles
    "pyyaml>=6",
]

[tool.uv]
package = false
