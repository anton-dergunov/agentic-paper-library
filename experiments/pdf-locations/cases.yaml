# Citations from the reader's chats in the library (16 sessions, 98 distinct links), each
# turned into the target an agent would pass to `paperlib locate`, with what the mark should
# cover. `link` is the link as the agent wrote it; `claim` the words it backed (shortened).
# Papers by their text path under the library.

zep: llm/memory/agent/Zep. A Temporal Knowledge Graph Architecture for Agent Memory.txt
memgpt: llm/memory/agent/MemGPT. Towards LLMs as Operating Systems.txt
completep: deep-learning/optimizers-and-schedules/Don't be lazy. CompleteP enables compute-efficient deep transformers.txt
spec: llm/prompting-and-in-context/Towards Spec Learning. Inference-Time Alignment from Preference Pairs.txt
judgebench: llm/evaluation/methods/JudgeBench. A Benchmark for Evaluating LLM-based Judges.txt
worldk: search-and-ranking/click-models-and-unbiased-ltr/On the Necessity of World Knowledge for Mitigating Missing Labels in Extreme Classification.txt
locomo: llm/memory/benchmarks/Evaluating Very Long-Term Conversational Memory of LLM Agents.txt
longmemeval: llm/memory/benchmarks/LongMemEval. Benchmarking Chat Assistants on Long-Term Interactive Memory.txt
lmcor: llm/post-training/fine-tuning/Small Language Models Improve Giants by Rewriting Their Outputs.txt
deepsearch: llm/retrieval-augmented/Benchmarking Deep Search over Heterogeneous Enterprise Data.txt
vllm: ml-systems/inference-and-serving/Efficient Memory Management for Large Language Model Serving with PagedAttention.txt
pope: ml-systems/inference-and-serving/Efficiently Scaling Transformer Inference.txt
gemini: llm/foundation-models/Gemini 1.5. Unlocking multimodal understanding across millions of tokens of context.txt

cases:
