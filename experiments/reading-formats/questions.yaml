# The test set of docs/plans/reading-formats.md. Pages are the PDF's; "tolerance" is for
# values read off a plot; answerable: false marks questions whose right answer is that the
# paper does not report it. Paper paths are under the library's library/ folder.

papers:
  dpo: llm/post-training/preference-learning/Direct Preference Optimization. Your Language Model is Secretly a Reward Model.md
  simpo: llm/post-training/preference-learning/SimPO. Simple Preference Optimization with a Reference-Free Reward.md
  gpt1: llm/foundation-models/Improving Language Understanding by Generative Pre-Training.md
  litm: llm/context/Lost in the Middle. How Language Models Use Long Contexts.md
  instructgpt: llm/post-training/preference-learning/Training language models to follow instructions with human feedback.md
  musique: llm/evaluation/benchmarks/MuSiQue. Multihop Questions via Single-hop Question Composition.md
  toolformer: llm/agents/Toolformer. Language Models Can Teach Themselves to Use Tools.md
  qwen3vl: vision-and-multimodal/vision-language/Qwen3-VL Technical Report.md
  ruler: llm/evaluation/benchmarks/RULER. What's the Real Context Size of Your Long-Context Language Models.md
  nolima: llm/evaluation/benchmarks/NoLiMa. Long-Context Evaluation Beyond Literal Matching.md
  orpo: llm/post-training/preference-learning/ORPO. Monolithic Preference Optimization without Reference Model.md
  ipo: llm/post-training/preference-learning/A General Theoretical Paradigm to Understand Learning from Human Preferences.md
  # B2: published after the model's training cutoff (June 2026)
  pair: recommender-systems/industrial-systems/PAIR. Preference-Aligned Intent Retrieval for Premium People Recommendation at LinkedIn.md
  sftrl: llm/post-training/rl-for-reasoning/SFT Conflicts, RL Coexists. A Theoretical and Empirical Analysis of Multi-Task Learning for LLMs.md
  kvxfer: ml-systems/inference-and-serving/Cross-Model KV Cache Transfer in LLM Families. A Closed-Form Linear Mapping for Prefill Reuse.md
  genrec: recommender-systems/industrial-systems/GenRec. An LLM-Backed Recommendation Ranker at Netflix.md

# E4: the markdown before a fix, as a git revision of the library.
old_revs:
  musique: 7f5bc9b3a
  toolformer: 7f5bc9b3a
  gpt1: 8969b9e25^
  qwen3vl: c4100a513^

questions:
# ---- E1: single paper, format only ----
- {id: D1, exp: E1, paper: dpo, kind: equation, page: 4,
   question: 'Write the DPO loss as the paper gives it, and say what plays the role of the reward.',
   gold: 'Eq. 7: L_DPO = -E_{(x,y_w,y_l)~D}[log σ(β log(π_θ(y_w|x)/π_ref(y_w|x)) - β log(π_θ(y_l|x)/π_ref(y_l|x)))]; the implicit reward r̂_θ(x,y) = β log(π_θ(y|x)/π_ref(y|x)).'}
- {id: D2, exp: E1, paper: dpo, kind: table, page: 9,
   question: 'On CNN/DailyMail, what GPT-4 win rates against the ground truth do DPO and PPO get at temperature 0.25?',
   gold: 'DPO 0.31, PPO 0.23 (Table 1).'}
- {id: D3, exp: E1, paper: dpo, kind: table, page: 10,
   question: 'In the human study, how often did humans agree with each other on the PPO-1 comparison, and how often did GPT-4 (C) agree with humans on the DPO comparison?',
   gold: 'Human–human agreement 87% (PPO-1); GPT-4 (C)–human agreement 67% (DPO) (Table 2).'}
- {id: D4, exp: E1, paper: dpo, kind: appendix, page: 20,
   question: 'What β, batch size, optimizer, learning rate and warm-up does DPO use by default, and what β for TL;DR?',
   gold: 'β = 0.1, batch size 64, RMSprop, learning rate 1e-6, linear warm-up from 0 to 1e-6 over 150 steps; β = 0.5 for TL;DR.'}
- {id: D5, exp: E1, paper: dpo, kind: figure, page: 7,
   question: 'In the TL;DR win-rate plot, what are PPO''s and DPO''s win rates at sampling temperature 1.0?',
   gold: 'PPO ≈ 0.07, DPO ≈ 0.39 (Figure 2, right).', tolerance: 'PPO 0.05–0.10; DPO 0.35–0.42'}
- {id: D6, exp: E1, paper: dpo, kind: unanswerable, answerable: false,
   question: 'What AlpacaEval 2 win rate does DPO report?',
   gold: 'Not reported: the paper evaluates on IMDb, TL;DR, Anthropic-HH and CNN/DailyMail, not AlpacaEval 2.'}

- {id: S1, exp: E1, paper: simpo, kind: table, page: 6,
   question: 'In the Llama-3-Instruct (8B) setting, what Arena-Hard win rate do SimPO and DPO get?',
   gold: 'SimPO 33.8, DPO 32.6 (Table 4).'}
- {id: S2, exp: E1, paper: simpo, kind: table, page: 6,
   question: 'In the Mistral-Instruct (7B) setting, which method has the highest Arena-Hard win rate, and what is it?',
   gold: 'CPO, 22.6 (SimPO gets 21.0) (Table 4).'}
- {id: S3, exp: E1, paper: simpo, kind: equation, page: 4,
   question: 'Write SimPO''s objective and name its two differences from DPO''s reward.',
   gold: 'Eq. 6: L_SimPO = -E[log σ((β/|y_w|) log π_θ(y_w|x) - (β/|y_l|) log π_θ(y_l|x) - γ)]; the reward is the length-normalised (average) log-likelihood with no reference model, and a target reward margin γ is added.'}
- {id: S4, exp: E1, paper: simpo, kind: appendix, page: 18,
   question: 'Which β, γ and learning rate does SimPO use for Llama-3-Instruct (8B)?',
   gold: 'β = 2.5, γ = 1.4 (γ/β = 0.56 is also acceptable if it is right), learning rate 1e-6 (Table 8).'}
- {id: S5, exp: E1, paper: simpo, kind: unanswerable, answerable: false, page: 2,
   question: 'What AlpacaEval 2 LC win rate does SimPO reach when applied to Llama-3-70B?',
   gold: 'Not reported: SimPO is not trained on a 70B model; the 34.4 LC in Table 1 is the off-the-shelf Llama-3-70B-Instruct from the leaderboard.'}
- {id: S6, exp: E1, paper: simpo, kind: citation, page: 14,
   question: 'Which work does SimPO cite for Arena-Hard, and under what reference number?',
   gold: '[54], Li et al., "From live data to high-quality benchmarks: The Arena-Hard pipeline", April 2024.'}

- {id: G1, exp: E1, paper: gpt1, kind: equation, page: 3,
   question: 'What objective is optimised during fine-tuning, and with what weight on the auxiliary term?',
   gold: 'Eq. 5: L_3(C) = L_2(C) + λ·L_1(C), the supervised objective plus the language-modelling objective as an auxiliary term; λ = 0.5 (p. 5).'}
- {id: G2, exp: E1, paper: gpt1, kind: table, page: 8,
   question: 'In the ablation table, what average score does the Transformer without pre-training get, and which variant has the highest average?',
   gold: 'Transformer w/o pre-training: 59.9 average; the highest average is Transformer w/o aux LM, 75.0 (Table 5).'}
- {id: G3, exp: E1, paper: gpt1, kind: table, page: 6,
   question: 'What accuracy does the model get on RACE-h, and what was the previous best?',
   gold: '57.4; previous best 50.3, BiAttention MRU (9x ensemble) (Table 3).'}
- {id: G4, exp: E1, paper: gpt1, kind: setup, page: 5,
   question: 'Give the model''s layers, state size, attention heads, context length, optimizer and peak learning rate.',
   gold: '12 layers, 768-dimensional states, 12 attention heads (3072-d feed-forward), contiguous sequences of 512 tokens, Adam, max learning rate 2.5e-4 (100 epochs, minibatches of 64).'}
- {id: G5, exp: E1, paper: gpt1, kind: figure, page: 7,
   question: 'What RACE dev accuracy is reached with 0 layers transferred and with all 12?',
   gold: 'About 40% with 0 layers and about 60% with all 12 (Figure 2, left).', tolerance: '±3 points each'}

- {id: L1, exp: E1, paper: litm, kind: appendix, page: 18,
   question: 'With 20 documents, what is GPT-3.5-Turbo''s accuracy when the answer document is first, and at its worst position; and how does the worst compare with closed-book?',
   gold: '75.8% at position 1 (index 0); worst 53.8% at index 9 (the 10th position); closed-book is 56.1%, so the worst position is below closed-book (Tables 6 and 1, pp. 18 and 5).'}
- {id: L2, exp: E1, paper: litm, kind: figure, page: 7,
   question: 'In the key-value task with 300 pairs, what accuracy does GPT-3.5-Turbo (16K) reach when the key is at the 200th position?',
   gold: 'About 45% (Figure 7).', tolerance: '40–50%'}
- {id: L3, exp: E1, paper: litm, kind: figure, page: 10,
   question: 'With 50 retrieved documents, what are Contriever''s recall and GPT-3.5-Turbo (16K)''s accuracy in the open-domain experiment?',
   gold: 'Recall about 89%, accuracy about 60% (Figure 11).', tolerance: 'recall 87–91%; accuracy 58–62%'}
- {id: L4, exp: E1, paper: litm, kind: prose, page: 6,
   question: 'How is the key-value retrieval task built: how many pairs, what are the keys, how many examples?',
   gold: 'Contexts of 75, 140 and 300 key-value pairs; keys and values are random 128-bit UUIDs; 500 examples per setting.'}
- {id: L5, exp: E1, paper: litm, kind: unanswerable, answerable: false, page: 15,
   question: 'What accuracy does GPT-4 reach with 30 documents?',
   gold: 'Not reported: GPT-4 is evaluated only with 20 documents, on a subset of 500 random examples (Appendix D).'}

- {id: I1, exp: E1, paper: instructgpt, kind: table, page: 33,
   question: 'How many reward-model training prompts came from labelers and how many from customers?',
   gold: '6,623 from labelers, 26,584 from customers (Table 6).'}
- {id: I2, exp: E1, paper: instructgpt, kind: appendix, page: 42,
   question: 'What KL coefficient and pretraining-gradient coefficient are used in PPO-ptx, and for how many episodes is RL trained?',
   gold: 'KL reward coefficient β = 0.02, pretraining loss coefficient γ = 27.8; 256k episodes (about 31k unique prompts).'}
- {id: I3, exp: E1, paper: instructgpt, kind: appendix, page: 40,
   question: 'What learning rate, batch size and number of epochs are used for the 175B SFT model?',
   gold: 'Learning rate 5.03e-6, batch size 8, 16 epochs.'}
- {id: I4, exp: E1, paper: instructgpt, kind: prose, page: 11,
   question: 'How often are 175B InstructGPT outputs preferred to GPT-3''s, and to few-shot GPT-3''s?',
   gold: '85 ± 3% of the time to GPT-3, 71 ± 4% to few-shot GPT-3.'}
- {id: I5, exp: E1, paper: instructgpt, kind: unanswerable, answerable: false, page: 17,
   question: 'How many GPU-hours did PPO training of the 175B model take?',
   gold: 'Not reported in GPU-hours; the paper gives 60 petaflop/s-days for 175B PPO-ptx (4.9 for 175B SFT, against 3,640 for GPT-3).'}

# ---- E1, tier B2: papers after the training cutoff; drafted by draft.py, checked by hand ----
- {id: P1, exp: E1, paper: pair, kind: table, page: 7,
   question: 'What ACC and MAR@25 does LinkedIn''s production Holistic-171 embedding get on the Premium user retrieval benchmark?',
   gold: 'ACC 0.794 and MAR@25 0.169 (Table 1).'}
- {id: P2, exp: E1, paper: pair, kind: table, page: 8,
   question: 'When the Matryoshka-trained PAIR model is truncated to 512 dimensions, what MAR@100 does it reach, and what is its relative retrieval latency compared with the full 1024-dimensional embedding?',
   gold: 'MAR@100 0.444, at a relative latency of 0.65x (relative storage 0.50x) (Table 3).'}
- {id: P3, exp: E1, paper: pair, kind: equation, page: 5,
   question: 'Write out the PAIR training objective for one query, and say what each term means.',
   gold: 'L_PAIR = -log[exp(s(q,d+)) / (exp(s(q,d+)) + Σ_{i=1..K} exp(s(q,d_i-)))], with s(q,d) = cos(e_q^final, e_d)/τ; e_q^final the fused query representation (profile plus history), e_d the candidate embedding, τ the temperature; d+ the clicked candidate, d_i- the K negatives (exposed-but-unclicked candidates and random members) (Eq. 2, with Eq. 1).'}
- {id: P4, exp: E1, paper: pair, kind: setup, page: 6,
   question: 'How large is the offline test set used to evaluate PAIR, in query-level instances and unique member profiles?',
   gold: '11.8K query-level instances involving 93K unique member profiles (Section 5.1).'}
- {id: P5, exp: E1, paper: pair, kind: figure, page: 6,
   question: 'In the architecture diagram, what pooling operation is labelled as producing the aggregated history embedding from the visited-profile embeddings, and what pooling produces the aggregated user embedding?',
   gold: 'GeM Pooling for the aggregated history embedding, Temporal-Gated Pooling for the aggregated user embedding (Figure 1, Step 1). A diagram label, not a plot value: PAIR has no plot; "Temporal-Gated" is in no text form, GeM pooling is in the prose as one of the variants compared.',
   tolerance: 'both labels named; "generalized-mean pooling" or "temporal gating" are acceptable variants'}
- {id: P6, exp: E1, paper: pair, kind: unanswerable, answerable: false, page: 5,
   question: 'What MAR@100 does PAIR reach when fine-tuned from a larger encoder such as Qwen3-Embedding-4B or 8B?',
   gold: 'Not reported: the paper evaluates only the 0.6B encoder, saying qualitatively that larger models add GPU cost without proportional gains. The reported result is MAR@100 0.450 for the 0.6B PAIR with P-ATT history.'}

- {id: M1, exp: E1, paper: sftrl, kind: table, page: 7,
   question: 'With full-parameter GRPO on DeepSeek-R1-Distill-Qwen-7B, what AIME2025 accuracy does Adapted Parallel-RL reach, and what does Single-Task RL reach on the same benchmark?',
   gold: 'Adapted Parallel-RL 59.0, Single-Task RL 57.1 (+1.9) (Table 4).'}
- {id: M2, exp: E1, paper: sftrl, kind: table, page: 25,
   question: 'In the 1.5B full-parameter PPO setting, which task update, when removed from the naive Parallel-RL merge, causes the largest drop on its own task, and what is that drop?',
   gold: 'Removing the Science update: MMLU falls from 48.9 to 35.6, a drop of 13.3 (Table 7).'}
- {id: M3, exp: E1, paper: sftrl, kind: equation, page: 6,
   question: 'State the paper''s upper bounds on cross-task gradient interference for SFT and for GRPO-style RL, and say what the bounding constants represent.',
   gold: '|I_SFT(i,j)| ≤ M_i·M_j (norm-limited), M_i² bounding the expected squared norm of the expert score function E‖S*_i(x)‖²; |I_RL(i,j)| ≤ V_i·V_j (variance-limited), V_i² bounding the expected intra-group variance of the residual score ΔS_{i,k} = S_{i,k} − mean S_i over the G rollouts (Theorem 4.5).'}
- {id: M4, exp: E1, paper: sftrl, kind: appendix, page: 13,
   question: 'What learning rate and how many rollouts per prompt were used for GRPO training, and was a KL penalty used?',
   gold: 'Learning rate 3e-6, G = 16 rollouts per prompt, no KL penalty (Appendix A.2).'}
- {id: M5, exp: E1, paper: sftrl, kind: figure, page: 23,
   question: 'In the rollout-temperature ablation, what MATH500 accuracy does the naive Parallel-RL model reach at τ = 0.8, and the math model at τ = 0.75?',
   gold: 'Naive Parallel-RL about 84.6 at τ = 0.8; math model about 87.2 at τ = 0.75 (Figure 5).', tolerance: '±0.2 each'}
- {id: M6, exp: E1, paper: sftrl, kind: unanswerable, answerable: false, page: 7,
   question: 'What pass@1 does Adapted Parallel-RL achieve on HumanEval with the 1.5B model?',
   gold: 'Not reported: code is evaluated only on LiveCodeBench, where Adapted Parallel-RL (1.5B, full-parameter GRPO) scores 22.5.'}

- {id: K1, exp: E1, paper: kvxfer, kind: table, page: 18,
   question: 'With the ridge mapper at its selected k, what MMLU accuracy and what GSM8K accuracy does Llama 3.1 8B→70B transfer achieve?',
   gold: 'MMLU 57.78 and GSM8K 14.78 (Table 13).'}
- {id: K2, exp: E1, paper: kvxfer, kind: table, page: 21,
   question: 'Among the six matched-KV pairs, which pair has the highest BoolQ retention on the benchmarks never used to select k, and what is that retention?',
   gold: 'Qwen3 14B→32B, 101.9% (Table 18).'}
- {id: K3, exp: E1, paper: kvxfer, kind: equation, page: 5,
   question: 'What is the closed-form solution the mapper uses for each per-head weight matrix, and what do its terms denote?',
   gold: 'W* = (XᵀX + λI)⁻¹XᵀY: X the N × (k·n_kv^s·d_h^s) matrix of concatenated source KV features from the top-k source layers over N calibration tokens; Y the N × d_h^t target keys or values (keys RoPE-stripped); λ = 0.01 the ridge penalty; X and Y centred first, bias b = Ȳ − X̄W* (Eq. 4).'}
- {id: K4, exp: E1, paper: kvxfer, kind: appendix, page: 17,
   question: 'What optimizer, learning rate, number of epochs and batch size are used to train the nonlinear MLP mapper baseline?',
   gold: 'Adam, learning rate 1e-3, 20 epochs, batch size 4,096, MSE loss (Appendix E).'}
- {id: K5, exp: E1, paper: kvxfer, kind: figure, page: 9,
   question: 'In the Qwen3 14B↔32B multi-turn CoQA handoff evaluation, what word-level F1 does the 32B model reach standalone at turn depth 10?',
   gold: 'About 0.90 (Figure 4, the top solid line at turn 10).', tolerance: '0.89–0.91'}
- {id: K6, exp: E1, paper: kvxfer, kind: unanswerable, answerable: false, page: 6,
   question: 'What HumanEval pass@1 retention does the ridge mapper achieve for Qwen3 14B→32B transfer?',
   gold: 'Not reported: no code-generation benchmark. The paper reports ARC-Challenge, HellaSwag, WinoGrande, MMLU, GSM8K, WikiText-2 perplexity, held-out PIQA, BoolQ, ARC-Easy and multi-turn CoQA; Qwen3 14B→32B averages 97.6% retention over the five accuracy benchmarks.'}

- {id: N1, exp: E1, paper: genrec, kind: table, page: 7,
   question: 'Compared with using an off-the-shelf open-source LLM as the base model, how much does Phase-1 foundation training improve offline MRR?',
   gold: 'About +10–20% offline MRR (Table 1; also in the prose of Section 5.3).'}
- {id: N2, exp: E1, paper: genrec, kind: table, page: 7,
   question: 'Which training phase contributes the larger gain in offline MRR, and what is the size of that gain relative to a freshly trained Phase-1 model?',
   gold: 'Phase 2: +35–50% offline MRR over a freshly trained Phase 1, the gain growing over time (Table 1; also in the prose).'}
- {id: N3, exp: E1, paper: genrec, kind: equation, page: 5,
   question: 'What is GenRec''s overall Phase-2 training loss, and what constraints apply to its weights?',
   gold: 'L = α·L_ranking + β·L_language + γ·L_miscellaneous, with α + β + γ = 1 and α, β, γ ≥ 0; L_ranking the catalog-aware ranking cross-entropy, L_language the language-modelling loss over verbalised inputs and outputs, L_miscellaneous other objectives (Section 4.4).'}
- {id: N4, exp: E1, paper: genrec, kind: setup, page: 6,
   question: 'How much Netflix traffic was allocated to the online A/B test of GenRec, and for how long did it run?',
   gold: 'About 10% of traffic, for 4 weeks (Section 5.1).'}
- {id: N5, exp: E1, paper: genrec, kind: figure, page: 7,
   question: 'For the ~10B backbone, what is the normalized offline ranking metric when Phase-2 training data is 5x the smallest configuration?',
   gold: 'About 1.11 (Figure 4).', tolerance: '1.10–1.12'}
- {id: N6, exp: E1, paper: genrec, kind: unanswerable, answerable: false, page: 6,
   question: 'What NDCG@10 does GenRec achieve offline compared with the production ranker?',
   gold: 'Not reported: the paper does not use NDCG; it reports offline ranking quality as relative MRR (e.g. about +1.6% relative MRR over the production baseline with about 40x fewer Phase-2 labelled examples).'}

