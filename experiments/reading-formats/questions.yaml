# ---- E6: equation structure (unseen papers; chosen by the author 25 Oct) ----
# Each answer depends on the layout of a formula: what is inside which sum, fraction,
# subscript or square root. The PDF's text layer scatters these across lines and columns;
# the markdown has arXiv's LaTeX.
- {id: Q1, exp: E6, paper: pair, kind: equation, page: 5,
   question: 'How does PAIR compute the attention weight α_i over the K recently clicked profiles, and the history embedding from those weights? Write both, and say where the positional encoding enters.',
   gold: 'α_i = exp(wᵀ(e_{h_i} + PE(i))) / Σ_{j=1..K} exp(wᵀ(e_{h_j} + PE(j))); e_H = Σ_{i=1..K} α_i e_{h_i}. PE(i) is added to the profile embedding inside the dot product with the learnable vector w; i = 1 is the most recent click (Eq. 5).'}
- {id: Q2, exp: E6, paper: pair, kind: equation, page: 5,
   question: 'How are the profile and history embeddings combined into the final query representation? Say what is normalised, which term the scalar γ multiplies, and what is applied last.',
   gold: 'ẽ_q = e_q/‖e_q‖₂ and ẽ_H = e_H/‖e_H‖₂ (each L2-normalised first); e_q^final = L2Norm(ẽ_q + γ ẽ_H): the learnable scalar γ scales only the normalised history embedding, and the sum is L2-normalised again (Eqs. 3–4).'}
- {id: Q3, exp: E6, paper: pair, kind: equation, page: 5,
   question: 'How is the Matryoshka objective formed from the PAIR loss: over which dimensions, and how are the per-dimension losses weighted?',
   gold: 'L = Σ_{d∈D} L_PAIR^(d) with D = {200, 256, 512, 1024}, an unweighted sum; L_PAIR^(d) is the PAIR loss computed on the first d embedding dimensions only (Eq. 6).'}
- {id: Q4, exp: E6, paper: genrec, kind: equation, page: 5,
   question: 'What arguments does GenRec''s verbalizer take when it builds the text sequence x, and how is the item metadata indexed?',
   gold: 'x = V(H, {M_i}_{i∈C}, τ): the interaction history H, the set of item metadata M_i indexed by items i ∈ C, and τ, the context (Eq. 1).'}
- {id: Q5, exp: E6, paper: sftrl, kind: equation, page: 4,
   question: 'In Proposition 4.1, over what set is the minimisation taken, what is minimised (with the order of its arguments), and how is the set of optimal policies defined?',
   gold: 'π^updated = argmin_{π ∈ P* ∩ Π} D_KL(π ‖ π_0): over the optimal policies that are also in the feasible family Π; the KL divergence from π to the initial policy π_0 (π first); P* = {q : E_q[R] = 1}, R: Y → {0, 1} a binary reward (Eq. 2).'}
- {id: Q6, exp: E6, paper: sftrl, kind: equation, page: 5,
   question: 'How is the standardised GRPO advantage defined? Give the group mean and the standard deviation, including the normalisation inside the standard deviation.',
   gold: 'μ_{r_i}(x) = (1/G) Σ_{k=1..G} r_{i,k}(x); σ_{r_i}(x) = sqrt((1/G) Σ_{k=1..G} (r_{i,k}(x) − μ_{r_i}(x))²), normalised by 1/G (not 1/(G−1)); Â_{i,k}(x) = (r_{i,k} − μ_{r_i}(x)) / σ_{r_i}(x) (Definition 4.2).'}
- {id: Q7, exp: E6, paper: sftrl, kind: equation, page: 5,
   question: 'Write Lemma 4.3''s decomposition of the RL gradient interference I_RL(i, j): the normalising factor, the sums, and which terms multiply which inner product.',
   gold: 'I_RL(i,j) = E_{x,x′}[(1/G²) Σ_{k=1..G} Σ_{l=1..G} Â_{i,k}(x) Â_{j,l}(x′) ⟨δS_{i,k}(x), δS_{j,l}(x′)⟩], with δS_{i,k}(x) = S_{i,k}(x) − S̄_i(x) and S̄_i(x) = (1/G) Σ_k S_{i,k}(x): the product of the two advantages weights the inner product of the residual score functions (Eq. 7).'}
- {id: Q8, exp: E6, paper: sftrl, kind: equation, page: 5,
   question: 'What tail bound does the paper state for the inner product of two tasks'' residual score vectors, and how does it depend on the dimension?',
   gold: 'P(|⟨δS_i, δS_j⟩| ≥ t) ≤ 2 exp(−c t² d): it decays exponentially in the dimension d (and in t²) (concentration of measure, citing Vershynin 2018).'}
- {id: Q9, exp: E6, paper: sftrl, kind: equation, page: 4,
   question: 'Write g_SFT and g_RL as the paper defines them, and say exactly where they differ.',
   gold: 'g_SFT = E_{x∼D, y∼π_expert}[∇_θ log π_θ(y|x)]; g_RL = E_{x∼D, y∼π_θ}[A(x,y) ∇_θ log π_θ(y|x)]: y is drawn from the expert in SFT and from the policy itself in RL, and RL weights the score function by the advantage A(x,y) (Eq. 1).'}

- {id: Q10, exp: E6, paper: sftrl, kind: equation-unusual, page: 20,
   question: 'In the appendix''s model of score functions as a shared direction plus noise, what lower bound does the paper derive on |cos(g_i^SFT, g_j^SFT)|, and what upper bound on |cos(g_i^RL, g_j^RL)|? Give both formulas and say what η, γ_{i,j} and γ_in are.',
   gold: 'SFT: |cos| ≥ (1 − 2η − η²)/(1 + η)² (Eq. 9, p. 19), η = σ/M_μ ≪ 1, the noise norm relative to the shared direction μ (‖ε‖ = σ = ηM_μ). RL: |cos| ≤ γ_{i,j}G/(1 − γ_in G) (Eq. 10, p. 21), ≲ O(γ_{i,j}G) as γ_in → 0; γ_{i,j} bounds |⟨ε_{i,k}, ε_{j,m}⟩|/σ² across the two tasks, γ_in the same within one task (k ≠ m). Asked because no prior knowledge gives these forms: a formula the model cannot complete from what such formulas usually are.'}

# ---- E3: across papers (tier D; golds checked against the PDFs and the library 25 Oct) ----
- {id: X1, exp: E3, papers: [dpo, ipo, simpo], kind: equations,
   question: 'How do the DPO, IPO and SimPO losses differ? Write each.',
   gold: 'DPO Eq. 7 (p. 4): -log σ of the β-scaled difference of policy/reference log-ratios; IPO empirical loss Eq. 17 (p. 7): E[(h_π(y_w,y_l) - τ^{-1}/2)^2], a squared loss towards a fixed margin; SimPO Eq. 6 (p. 4): length-normalised log-likelihood, no reference model, target margin γ.'}
- {id: X2, exp: E3, papers: [dpo, orpo, simpo], kind: tables,
   question: 'What AlpacaEval 2 score does each of DPO, ORPO and SimPO report for its own method on Mistral-7B?',
   gold: 'DPO: none (no AlpacaEval 2 in the paper); ORPO: Mistral-ORPO-β 12.20% raw win rate (Table 1, p. 6); SimPO: 21.5 LC / 20.8 WR (Mistral-Base), 32.1 LC / 34.8 WR (Mistral-Instruct) (Table 4, p. 6). Not comparable: LC vs raw win rate, different bases.'}
- {id: X3, exp: E3, papers: [ruler, nolima], kind: numbers,
   question: 'What effective context length do RULER and NoLiMa report for Llama 3.1 70B, and why do they differ?',
   gold: 'RULER 64K of 128K claimed (Table 3, p. 7); NoLiMa 2K of 128K (Table 3, p. 5); NoLiMa''s needles share no literal words with the question, so retrieval needs a latent association; the thresholds differ too (RULER: Llama-2-7B''s 85.6; NoLiMa: 85% of each model''s base score).'}
- {id: X4, exp: E3, papers: [], kind: library,
   question: 'Which papers in the library propose a preference-optimisation method without a reference model?',
   gold: 'SimPO and ORPO. No other paper in llm/post-training/preference-learning proposes one (checked 25 Oct); KTO and DPO keep a reference model. A paper named from elsewhere counts only if the answer shows that it proposes a reference-free preference-optimisation method.'}
- {id: X5, exp: E3, papers: [], kind: library,
   question: 'Which papers in the library propose a remedy for the lost-in-the-middle position bias, and what does each change?',
   gold: 'Found in the Middle (subtracts the positional attention bias measured with a dummy document); Make Your LLM Fully Utilize the Context (FILM-7B, IN2 training on synthetic long-context data); STRING in Why Does the Effective Context Length of LLMs Fall Short (reuses well-trained smaller position indices for distant tokens); LongLLMLingua (reorders documents by importance after compression, §4.2, p. 4); Lost in the Middle''s own query-aware contextualization (the question before and after the data) helps key-value retrieval only. The first three are the review''s "Repairing the reader" (reviews/llm/context.md); naming at least those three with what each changes is correct.'}
- {id: X6, exp: E3, papers: [instructgpt, dpo], kind: equations,
   question: 'InstructGPT and DPO both start from a KL-regularised RL objective. Write each and say how they differ.',
   gold: 'InstructGPT Eq. 2 (p. 9): E[r_θ(x,y) - β log(π^RL_φ(y|x)/π^SFT(y|x))] + γ E_{x~D_pretrain}[log π^RL_φ(x)]; DPO Eq. 3 (p. 3): max_π E[r_φ(x,y)] - β D_KL[π_θ(y|x) || π_ref(y|x)]; InstructGPT adds the pretraining term (γ = 27.8).'}
